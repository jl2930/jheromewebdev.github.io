<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Test Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="schedscript.js"></script>

</head>
<body class="bg-gray-100">

    <nav class="bg-black shadow">
        <div class="max-w-6xl mx-auto px-2">
            <div class="flex items-center py-2 justify-between">
                <div>
                    <a href="index.html">
                        <img src="pictures/logonoshadow.png" alt="logo" class="transition-all duration-300 ease-in-out hover:scale-110 w-20 h-auto">
                    </a>
                </div>
                <div class="flex items-center justify-center ml-10 space-x-4 flex-grow hidden md:flex">
                    <a href="../index.html" class="px-3 py-2 text-white transition-all duration-300 ease-in-out hover:underline hover:scale-105">Home</a>
                    <a href="../equipment.html" class="px-3 py-2 text-white transition-all duration-300 ease-in-out hover:underline hover:scale-105">Equipment</a>
                    <a href="testbrand.html" class="px-3 py-2 text-white transition-all duration-300 ease-in-out hover:underline hover:scale-105">Brands</a>
                    <a href="../aboutus.html" class="px-3 py-2 text-white transition-all duration-300 ease-in-out hover:underline hover:scale-105">About Us</a>
                </div>
                <div class="ml-auto cursor-pointer mr-6 md:mr-7 sm:mr-6 relative" id="cart-icon" draggable="true">
                    <img src="pictures/scwhite.png" alt="sc" class="w-8 h-8 align-top transition-all duration-300 ease-in-out hover:scale-110">
                    <span id="cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-xs rounded-full px-1">0</span>
                </div>
                <div class="md:hidden">
                    <button id="hamburger" class="text-white focus:outline-none transition-all duration-300 ease-in-out hover:scale-110">
                       <img src="pictures/hamb.png" alt="hamburgerr" class="w-6 h-6">
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="hidden md:hidden" id="mobile-menu">
        <div class="flex flex-col bg-black text-white">
            <a href="../index.html" class="px-4 py-2 transition-all duration-300 ease-in-out hover:underline hover:scale-90">Home</a>
            <a href="../equipment.html" class="px-4 py-2 transition-all duration-300 ease-in-out hover:underline hover:scale-90">Equipment</a>
            <a href="testbrand.html" class="px-4 py-2 transition-all duration-300 ease-in-out hover:underline hover:scale-90">Brands</a>
            <a href="../aboutus.html" class="px-4 py-2 transition-all duration-300 ease-in-out hover:underline hover:scale-90">About Us</a>
        </div>
    </div>

    <main class="max-w-4xl mx-auto py-8 px-4">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="text-center bg-red-500 p-4">
                <h2 class="text-xl font-bold text-gray-100">SCHEDULE TEST RIDE</h2>
                <h3 class="text-lg font-semibold text-gray-100" id="motorcycle-model">Motorcycle Model</h3>
            </div>
            
            <form class="p-6 space-y-6" id="test-ride-form">
                <input type="hidden" id="motorcycle-model-input" name="motorcycle-model">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="first-name" class="block text-sm font-medium text-gray-700">First Name*</label>
                        <input type="text" id="first-name" name="first-name" required 
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border">
                    </div>
                    <div>
                        <label for="last-name" class="block text-sm font-medium text-gray-700">Last Name*</label>
                        <input type="text" id="last-name" name="last-name" required 
                               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border">
                    </div>
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email*</label>
                    <input type="email" id="email" name="email" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border">
                </div>
                
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number*</label>
                    <input type="tel" id="phone" name="phone" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border">
                </div>
                
                <div>
                    <label for="age" class="block text-sm font-medium text-gray-700">Age*</label>
                    <input type="number" id="age" name="age" min="18" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border">
                </div>
                
                <div>
                    <label for="date" class="block text-sm font-medium text-gray-700">Preferred Test Ride Date*</label>
                    <input type="date" id="date" name="date" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border">
                </div>
                
                <div>
                    <label for="owned-motorcycles" class="block text-sm font-medium text-gray-700">Motorcycles Currently Owned (if any)</label>
                    <textarea id="owned-motorcycles" name="owned-motorcycles" rows="2" 
                              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border"></textarea>
                </div>
                
                <div>
                    <label for="riding-experience" class="block text-sm font-medium text-gray-700">Years of Riding Experience*</label>
                    <select id="riding-experience" name="riding-experience" required 
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 p-2 border">
                        <option value="">Select...</option>
                        <option value="0-1">Less than 1 year</option>
                        <option value="1-3">1-3 years</option>
                        <option value="3-5">3-5 years</option>
                        <option value="5-10">5-10 years</option>
                        <option value="10+">More than 10 years</option>
                    </select>
                </div>
                
                <div class="flex items-center">
                    <input id="terms" name="terms" type="checkbox" required 
                           class="h-4 w-4 rounded border-gray-300 text-red-600 focus:ring-red-500">
                    <label for="terms" class="ml-2 block text-sm text-gray-700">
                        I agree to the terms and conditions and understand that a valid motorcycle license is required for test rides.
                    </label>
                </div>
                
                <div class="flex justify-center">
                    <button type="submit" 
                            class="px-8 py-3 bg-red-600 text-white font-semibold rounded-md hover:bg-red-700 transition duration-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                        Submit Request
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
